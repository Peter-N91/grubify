# Explicit dispatch avoids GITHUB_TOKEN-generated label event suppression.
# NEVER checkout/execute PR head. Helpers, agents and APM come from trusted main.
name: Squad Review (independent static evidence)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open same-repo main-target PR with squad/review; human recovery may omit source fields'
        required: true
        type: string
      source_run_id:
        description: 'Automatic linkage only: generation run ID'
        required: false
        default: ''
        type: string
      source_attempt:
        description: 'Automatic linkage only: successful generation apply attempt'
        required: false
        default: ''
        type: string
      result_artifact_id:
        description: 'Automatic linkage only: deterministic generation result artifact ID'
        required: false
        default: ''
        type: string
      result_sha256:
        description: 'Automatic linkage only: deterministic result digest'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: squad-review-pr-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'Peter-N91/grubify' &&
      vars.SQUAD_WATCH_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      authorized: ${{ steps.prepare.outputs.authorized }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      request_sha256: ${{ steps.prepare.outputs.request_sha256 }}
      request_attempt: ${{ steps.prepare.outputs.producer_attempt }}
      request_artifact: ${{ steps.prepare.outputs.artifact_name }}
      request_artifact_id: ${{ steps.request-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Authorize automatic source artifact metadata before downloading
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            await require('./scripts/squad-watch/review.cjs').select({ github, context, core });
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.source.outputs.automatic == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.source_run }}
          artifact-ids: ${{ steps.source.outputs.result_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/squad-source-result
      - name: Authorize exact PR and snapshot immutable source as untrusted JSON
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          SOURCE_RESULT_DIR: ${{ runner.temp }}/squad-source-result
          REQUEST_DIR: ${{ runner.temp }}/squad-review-request
        with:
          script: |
            await require('./scripts/squad-watch/review.cjs').prepare({ github, context, core });
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: request-upload
        if: steps.prepare.outputs.authorized == 'true'
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/squad-review-request/request.json
            ${{ runner.temp }}/squad-review-request/snapshot.json
          if-no-files-found: error
          retention-days: 1

  review:
    needs: prepare
    if: vars.SQUAD_WATCH_ENABLED == 'true' && needs.prepare.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    outputs:
      result_sha256: ${{ steps.stage.outputs.result_sha256 }}
      result_attempt: ${{ steps.stage.outputs.producer_attempt }}
      result_artifact: ${{ steps.stage.outputs.artifact_name }}
      result_artifact_id: ${{ steps.result-upload.outputs.artifact-id }}
    env:
      REQUEST_DIR: .watch-run
      EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      EXPECTED_REQUEST_SHA256: ${{ needs.prepare.outputs.request_sha256 }}
      EXPECTED_REQUEST_ATTEMPT: ${{ needs.prepare.outputs.request_attempt }}
      EXPECTED_REQUEST_ARTIFACT: ${{ needs.prepare.outputs.request_artifact }}
      EXPECTED_REQUEST_ARTIFACT_ID: ${{ needs.prepare.outputs.request_artifact_id }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      INITIAL_ACTOR: ${{ github.actor }}
    steps:
      - name: Initialize runner-local artifact path
        run: |
          set -euo pipefail
          printf 'SOURCE_RESULT_DIR=%s/squad-source-result\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.request_artifact_id }}
          merge-multiple: true
          path: .watch-run
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.source_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          artifact-ids: ${{ inputs.result_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/squad-source-result
      - name: Recheck authorization/source/PR before any AI secret
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./scripts/squad-watch/review.cjs').revalidate({ github, context, core });
      - name: Require dedicated Requests-only secret before installation
        if: steps.check.outputs.duplicate != 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error::Missing COPILOT_GITHUB_TOKEN: use ONLY Copilot Requests authorization, never repository-write/cloud credentials."
            exit 1
          fi
      - name: Integrity-checked frozen main tools/assets only
        if: steps.check.outputs.duplicate != 'true'
        timeout-minutes: 14
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/squad-watch/install-tools.sh
      - name: Copy trusted stage helper, freeze runtime spine and inputs
        if: steps.check.outputs.duplicate != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/squad-review-helper"
          cp scripts/squad-watch/{policy,pipeline,runtime,progress,completion-gate,review,diagnostics}.cjs "$RUNNER_TEMP/squad-review-helper/"
          node scripts/squad-watch/review.cjs prompt
          sha256sum .github/squad-watch.json apm.yml apm.lock.yaml .watch-run/request.json .watch-run/snapshot.json .watch-run/prompt.txt > "$RUNNER_TEMP/squad-review-helper/runtime.sha256"
      - name: Recheck directly before independent coordinator
        id: final-check
        if: steps.check.outputs.duplicate != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./scripts/squad-watch/review.cjs').revalidate({ github, context, core });
      - name: Independent pr-N Squad (Requests-only, no PR code execution)
        id: coordinator
        if: steps.check.outputs.duplicate != 'true' && steps.final-check.outputs.duplicate != 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: bash scripts/squad-watch/run-review.sh
      - name: Validate real review artifacts and sanitized role history
        id: stage
        if: steps.check.outputs.duplicate != 'true' && steps.final-check.outputs.duplicate != 'true'
        env:
          REVIEW_RESULT_DIR: ${{ runner.temp }}/squad-review-result
        run: |
          set -euo pipefail
          sha256sum --check --status "$RUNNER_TEMP/squad-review-helper/runtime.sha256"
          node "$RUNNER_TEMP/squad-review-helper/review.cjs" stage
      - name: Record safe review runtime metadata
        if: always() && steps.coordinator.outcome != 'skipped'
        env:
          AUDIT_MEMBER: pr-${{ inputs.pr_number }}
          MODEL_OUTCOME: ${{ steps.coordinator.outcome }}
          HANDOFF_OUTCOME: ${{ steps.stage.outcome }}
          CLI_EXIT_CODE: ${{ steps.coordinator.outputs.cli_exit_code }}
          DIAGNOSTIC_DIR: ${{ runner.temp }}/squad-review-diagnostics
        run: node "$RUNNER_TEMP/squad-review-helper/diagnostics.cjs"
      - name: Upload safe review runtime metadata only
        if: always() && steps.coordinator.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: squad-review-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/squad-review-diagnostics/runtime-status.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: result-upload
        if: steps.stage.outputs.artifact_name != ''
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: ${{ runner.temp }}/squad-review-result/review.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, review]
    if: >-
      vars.SQUAD_WATCH_ENABLED == 'true' &&
      needs.review.outputs.result_artifact_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
      issues: write
    env:
      EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      EXPECTED_REQUEST_SHA256: ${{ needs.prepare.outputs.request_sha256 }}
      EXPECTED_REQUEST_ATTEMPT: ${{ needs.prepare.outputs.request_attempt }}
      EXPECTED_REQUEST_ARTIFACT: ${{ needs.prepare.outputs.request_artifact }}
      EXPECTED_REQUEST_ARTIFACT_ID: ${{ needs.prepare.outputs.request_artifact_id }}
      EXPECTED_REVIEW_SHA256: ${{ needs.review.outputs.result_sha256 }}
      EXPECTED_REVIEW_ATTEMPT: ${{ needs.review.outputs.result_attempt }}
      EXPECTED_REVIEW_ARTIFACT: ${{ needs.review.outputs.result_artifact }}
      EXPECTED_REVIEW_ARTIFACT_ID: ${{ needs.review.outputs.result_artifact_id }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - name: Initialize runner-local artifact paths
        run: |
          set -euo pipefail
          printf 'REQUEST_DIR=%s/squad-review-request\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'REVIEW_RESULT_DIR=%s/squad-review-result\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SOURCE_RESULT_DIR=%s/squad-source-result\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.request_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/squad-review-request
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.review.outputs.result_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/squad-review-result
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.source_run_id != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          artifact-ids: ${{ inputs.result_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/squad-source-result
      - name: Revalidate exact head/actors/audit; one escaped COMMENT, never APPROVE
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./scripts/squad-watch/review.cjs').publish({ github, context, core });
