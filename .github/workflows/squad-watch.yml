# Consumer adaptation of Peter-N91/hve-squad v0.18.1's HARDENED LIVE workflow.
# Upstream MIT notice: scripts/squad-watch/UPSTREAM-LICENSE.txt.
# Deliberately inactive until the repository variable is explicitly enabled.
# See .github/squad-watch.json for prerequisites, boundaries and intended writes.
name: Squad Watch (draft only)

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open, sanitized issue number (main branch only)'
        required: true
        type: string
      max_ai_credits:
        description: 'Native shared session soft cap, 30..90 AI credits; blank uses 90 (NOT USD/tokens)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  # Label and manual dispatch share a lock. No mid-run cancellation or force push.
  group: squad-watch-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'Peter-N91/grubify' &&
      vars.SQUAD_WATCH_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' && github.event.label.name == 'squad/auto'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      authorized: ${{ steps.prepare.outputs.authorized }}
      issue: ${{ steps.prepare.outputs.issue }}
      base_sha: ${{ steps.prepare.outputs.base_sha }}
      request_sha256: ${{ steps.prepare.outputs.request_sha256 }}
      request_attempt: ${{ steps.prepare.outputs.producer_attempt }}
      request_artifact: ${{ steps.prepare.outputs.artifact_name }}
      request_artifact_id: ${{ steps.request-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize and snapshot immutable request
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REQUEST_DIR: ${{ runner.temp }}/squad-request
        with:
          script: |
            const prepare = require('./scripts/squad-watch/prepare.cjs');
            await prepare({ github, context, core });
      - name: Upload authorized request (already-public issue data only)
        id: request-upload
        if: steps.prepare.outputs.authorized == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/squad-request/request.json
          if-no-files-found: error
          retention-days: 1

  interpret:
    needs: prepare
    if: needs.prepare.outputs.authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      handoff_attempt: ${{ steps.stage.outputs.producer_attempt }}
      handoff_artifact: ${{ steps.stage.outputs.artifact_name }}
      handoff_artifact_id: ${{ steps.handoff-upload.outputs.artifact-id }}
    env:
      REQUEST_DIR: .watch-run
      EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
      EXPECTED_ISSUE: ${{ needs.prepare.outputs.issue }}
      EXPECTED_REQUEST_SHA256: ${{ needs.prepare.outputs.request_sha256 }}
      EXPECTED_REQUEST_ATTEMPT: ${{ needs.prepare.outputs.request_attempt }}
      EXPECTED_REQUEST_ARTIFACT: ${{ needs.prepare.outputs.request_artifact }}
      EXPECTED_REQUEST_ARTIFACT_ID: ${{ needs.prepare.outputs.request_artifact_id }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.request_artifact_id }}
          merge-multiple: true
          path: .watch-run
      - name: Independently authorize current rerun actor and revalidate request before any AI secret
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prepare = require('./scripts/squad-watch/prepare.cjs');
            await prepare.revalidate({ github, context, core });
      - name: Fail explicitly before installing or running AI without its secret
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error::Missing COPILOT_GITHUB_TOKEN: supply a dedicated fine-grained PAT with ONLY Copilot Requests. Do not substitute a repository-write or cloud token."
            exit 1
          fi
      - name: Install integrity-checked APM and pinned CLI; frozen consumer assets
        timeout-minutes: 14
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/squad-watch/install-tools.sh
      - name: Copy trusted handoff helper before model work
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/squad-helper"
          cp scripts/squad-watch/{policy,pipeline,runtime,progress,completion-gate,handoff,diagnostics}.cjs "$RUNNER_TEMP/squad-helper/"
          node scripts/squad-watch/handoff.cjs prompt
      - name: Recheck authorization and staleness after tool installation, immediately before model work
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prepare = require('./scripts/squad-watch/prepare.cjs');
            await prepare.revalidate({ github, context, core });
      - name: Run explicit federation coordinator (read-only credential boundary)
        id: coordinator
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: bash scripts/squad-watch/run-squad.sh
      - name: Validate and stage bounded artifact (never CLI sessions/transcripts)
        id: stage
        env:
          HANDOFF_DIR: ${{ runner.temp }}/squad-handoff
        run: node "$RUNNER_TEMP/squad-helper/handoff.cjs" stage
      - name: Record safe runtime outcome even when audit validation fails
        if: always() && steps.coordinator.outcome != 'skipped'
        env:
          AUDIT_MEMBER: issue-${{ needs.prepare.outputs.issue }}
          MODEL_OUTCOME: ${{ steps.coordinator.outcome }}
          HANDOFF_OUTCOME: ${{ steps.stage.outcome }}
          CLI_EXIT_CODE: ${{ steps.coordinator.outputs.cli_exit_code }}
          DIAGNOSTIC_DIR: ${{ runner.temp }}/squad-diagnostics
        run: node "$RUNNER_TEMP/squad-helper/diagnostics.cjs"
      - name: Upload safe runtime metadata only (never model output)
        if: always() && steps.coordinator.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: squad-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/squad-diagnostics/runtime-status.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: handoff-upload
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/squad-handoff/handoff.json
            ${{ runner.temp }}/squad-handoff/squad-watch.patch
          if-no-files-found: error
          retention-days: 1

  apply:
    needs: [prepare, interpret]
    if: needs.prepare.outputs.authorized == 'true' && needs.interpret.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      status: ${{ steps.apply.outputs.status }}
      pr: ${{ steps.apply.outputs.pr }}
      result_sha256: ${{ steps.apply.outputs.result_sha256 }}
      result_artifact_id: ${{ steps.result-upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.request_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/squad-request
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.interpret.outputs.handoff_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/squad-handoff
      - name: Independently validate; create-only branch and DRAFT PR via structured API
        id: apply
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUEST_DIR: ${{ runner.temp }}/squad-request
          HANDOFF_DIR: ${{ runner.temp }}/squad-handoff
          EXPECTED_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          EXPECTED_ISSUE: ${{ needs.prepare.outputs.issue }}
          EXPECTED_REQUEST_SHA256: ${{ needs.prepare.outputs.request_sha256 }}
          EXPECTED_REQUEST_ATTEMPT: ${{ needs.prepare.outputs.request_attempt }}
          EXPECTED_REQUEST_ARTIFACT: ${{ needs.prepare.outputs.request_artifact }}
          EXPECTED_REQUEST_ARTIFACT_ID: ${{ needs.prepare.outputs.request_artifact_id }}
          EXPECTED_HANDOFF_ATTEMPT: ${{ needs.interpret.outputs.handoff_attempt }}
          EXPECTED_HANDOFF_ARTIFACT: ${{ needs.interpret.outputs.handoff_artifact }}
          EXPECTED_HANDOFF_ARTIFACT_ID: ${{ needs.interpret.outputs.handoff_artifact_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RESULT_DIR: ${{ runner.temp }}/squad-result
        with:
          script: |
            // Loaded from the trusted base before applying any model-authored patch.
            const apply = require('./scripts/squad-watch/apply.cjs');
            await apply({ github, context, core });
      - name: Upload deterministic PR linkage (not model-authored)
        id: result-upload
        if: steps.apply.outputs.status == 'draft-created'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.apply.outputs.result_artifact }}
          path: ${{ runner.temp }}/squad-result/result.json
          if-no-files-found: error
          retention-days: 1

  dispatch-review:
    needs: [prepare, apply]
    if: >-
      vars.SQUAD_WATCH_ENABLED == 'true' &&
      needs.apply.outputs.status == 'draft-created'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Explicit second-workflow handoff (bot label events are suppressed)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR: ${{ needs.apply.outputs.pr }}
          ARTIFACT_ID: ${{ needs.apply.outputs.result_artifact_id }}
          RESULT_SHA256: ${{ needs.apply.outputs.result_sha256 }}
        with:
          script: |
            const { PR, ARTIFACT_ID, RESULT_SHA256 } = process.env;
            const link = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${PR}`;
            if (![PR, ARTIFACT_ID].every(x => /^[1-9][0-9]*$/.test(x)) ||
                !/^[0-9a-f]{64}$/.test(RESULT_SHA256)) throw new Error(`Invalid review linkage for ${link}`);
            try {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'squad-review.yml', ref: 'main',
                inputs: { pr_number: PR, source_run_id: String(context.runId),
                  source_attempt: process.env.GITHUB_RUN_ATTEMPT,
                  result_artifact_id: ARTIFACT_ID, result_sha256: RESULT_SHA256 }
              });
            } catch {
              throw new Error(`Draft ${link} exists with squad/review, but second-Squad dispatch failed. Human recovery: dispatch Squad Review for this PR; do not rerun generation.`);
            }

  notify:
    needs: [prepare, interpret, apply]
    if: >-
      always() && needs.prepare.outputs.authorized == 'true' &&
      (needs.interpret.result == 'failure' || needs.apply.result == 'failure' ||
       needs.apply.outputs.status == 'no-change')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Fixed human escalation only (no model text)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE: ${{ needs.prepare.outputs.issue }}
          STATUS: ${{ needs.apply.outputs.status }}
        with:
          script: |
            const value = process.env.ISSUE;
            if (!/^[1-9][0-9]*$/.test(value)) throw new Error('Invalid escalation target');
            const outcome = process.env.STATUS === 'no-change'
              ? 'produced no changes' : 'failed closed';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: Number(value),
              body: `Squad Watch ${outcome}. Human review is required; no merge or deployment was performed. Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
